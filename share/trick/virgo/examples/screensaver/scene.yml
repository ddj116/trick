# Configuration file for VIRGO to consume related to this simulation configuration
name: VIRGO-based screensaver
description: |
     An example of how VIRGO can be extended to alter the behavior
     of the framework. This example creates classes that extende from
     VIRGO base classes to provide a screensaver application that
     displays the current local time and weather.
resolution: 1920x1080
start_mode: PLAYING
background_color: [0.0, 0.0, 0.05]
starfield: 1
actors:
  moon: 
    mesh: VIRGO_PREFAB:moon8k      # High resolution moon
    scale: 1.0             # Size multiplier
    pos:   [0.0, 0.0, 0.0] # initial position offset in scene
    ypr:   [0.0, 0.0, 0.0] # pitch-yaw-roll rotation offset, applied after pos:
    pickable: 0
  earth: 
    mesh: VIRGO_PREFAB:earth       # Medium resolution earth
    pos:   [0.0, 384000000, 0.0]   # 3.844e8 meters from the moon
camera:
  position: [0.0, -13381000.0, 0]  # Initial camera position
  focal_point: [0, 0, 0]           # Where the camera points
sun:
  direction: [1.0, 0.0, 0.0]  # World vector pointing towards sun
lighting:
  start_mode: realistic
  dark_ambient: 0.1
  bright_ambient: 0.7